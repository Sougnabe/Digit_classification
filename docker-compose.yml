services:
  api:
    build: .
    expose:
      - "8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  gateway:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - API_URL=http://gateway:8000
    depends_on:
      - gateway
